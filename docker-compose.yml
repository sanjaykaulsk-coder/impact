# Images are pulled via mirror.gcr.io (Google's public Docker Hub pull-through cache) rather than
# docker.io directly. This works from any machine and sidesteps registries that some corporate/CI
# egress policies block; it is not specific to any one environment.
name: impact-field-command

services:
  postgres:
    image: mirror.gcr.io/postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-impact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-impact_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-impact_field_command}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-impact} -d ${POSTGRES_DB:-impact_field_command}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: mirror.gcr.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-impact_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-impact_minio_dev_password_change_me}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: mirror.gcr.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-impact_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-impact_minio_dev_password_change_me}
      MINIO_BUCKET_MEDIA: ${MINIO_BUCKET_MEDIA:-field-command-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      (mc mb local/$$MINIO_BUCKET_MEDIA || true) &&
      mc version enable local/$$MINIO_BUCKET_MEDIA &&
      echo 'MinIO bucket ready: '$$MINIO_BUCKET_MEDIA
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
