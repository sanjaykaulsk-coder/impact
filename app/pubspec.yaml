name: field_command
description: "IMPACT FIELD COMMAND — field execution app (Phase C shell)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Regional languages (Post-MVP backlog): standard Flutter i18n — ARB-file translations codegen'd
  # into a typed AppLocalizations class, not a hand-rolled string map. This is the extensible path
  # (see docs/ASSUMPTIONS.md) since the whole point is room to add more languages later, not just
  # this one pair.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management + navigation (CLAUDE.md locked decisions)
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # API client
  http: ^1.2.2
  http_parser: ^4.1.2

  # Token + device-fingerprint persistence (encrypted platform keystore/keychain)
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2

  # Field thread (Stage 2 Session B): camera-only evidence, GPS, offline outbox + background sync
  # (CLAUDE.md locked decisions: Drift + WorkManager)
  camera: ^0.11.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.5
  path: ^1.9.0
  workmanager: ^0.9.0+3
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  crypto: ^3.0.6

  # Offline map corridors (spec §20, Post-MVP backlog): flutter_map renders OpenStreetMap tiles
  # from any TileProvider, including a custom on-disk cache — unlike google_maps_flutter, which
  # only speaks to Google's own hosted tile service and has no offline-corridor story at all.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # "External navigation apps may be opened when available" (spec §20) — same
  # https://maps.google.com/?q=lat,lng pattern the web Live Map page already uses for supervisors.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  image_path: "assets/brand/logo-square.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/logo-adaptive-foreground.png"
