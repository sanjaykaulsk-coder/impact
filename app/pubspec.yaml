name: field_command
description: "IMPACT FIELD COMMAND — field execution app (Phase C shell)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + navigation (CLAUDE.md locked decisions)
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # API client
  http: ^1.2.2

  # Token + device-fingerprint persistence (encrypted platform keystore/keychain)
  flutter_secure_storage: ^9.2.2
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  image_path: "assets/brand/logo-square.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/brand/logo-adaptive-foreground.png"
